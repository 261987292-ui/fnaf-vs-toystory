name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android manifest
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "android.permission.VIBRATE" not in text:
              pos = text.find("<application")
              if pos == -1:
                  raise RuntimeError("Could not find <application> in AndroidManifest.xml")
              text = text[:pos] + '    <uses-permission android:name="android.permission.VIBRATE" />\n\n' + text[pos:]
          if "<activity" in text:
              text = text.replace("<activity", '<activity android:screenOrientation="landscape"', 1)
          p.write_text(text)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNaF-vs-ToyStory-3D
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk#FNaF-vs-ToyStory-3D.apk --title "FNaF vs Toy Story 3D - Latest" --notes "APK debug generado automáticamente." --clobber
